# Politique de dépendances — `cargo deny check`
#
# Le projet est publié sous GPL-3.0-or-later : toute dépendance open source
# est acceptable, y compris copyleft. Voir docs/rust-audio-stack.md.
#
# cargo-deny ne sert donc plus à filtrer le copyleft, mais à repérer :
#   - les licences NON LIBRES (non-commercial, « research only »),
#   - GPL-2.0-only, incompatible avec GPL-3.0,
#   - les avis de sécurité et les crates que nous tirons directement sans
#     mainteneur.
#
#   cargo install --locked cargo-deny
#   cargo deny check

[graph]
all-features = true

[licenses]
# Une occurrence hors de cette liste fait échouer la vérification. GPL-2.0-only
# (sans « or later ») en est volontairement absent : incompatible avec GPL-3.0.
# Les licences non libres (CC-BY-NC-*, « research only ») aussi.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs (via ureq)
    "0BSD",                # varint-rs (via pmtiles)
    "BSL-1.0",             # xxhash-rust (via burn-store)
    "bzip2-1.0.6",         # libbz2-rs-sys (via zip → burn-store)
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.93
# La liste ci-dessus vaut aussi comme politique affichée : on n'avertit pas
# des entrées copyleft qu'aucune dépendance actuelle n'emploie encore.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les dépendances internes (`path = "../xxx"`) n'ont pas de version : cargo-deny
# les voit comme des jokers `*`. Ce n'en sont pas.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# « Non maintenu » ne se juge que sur ce qu'on tire directement : les avis qui
# visent des crates transitives (gtk3 via tauri, bincode via burn, paste, unic)
# ne sont pas actionnables ici.
unmaintained = "workspace"
ignore = [
    # zip 8.6, tiré par burn-store 0.21 (correctif en zip ≥ 9, hors de portée
    # sans monter Burn) : les trois avis visent `extract()`, que burn-store
    # n'appelle pas — il lit les archives `.pt` sans rien extraire sur disque.
    # À retirer à la prochaine montée de Burn.
    { id = "RUSTSEC-2026-0367", reason = "zip::extract non appelé (burn-store lit seulement)" },
    { id = "RUSTSEC-2026-0368", reason = "zip::extract non appelé (burn-store lit seulement)" },
    { id = "RUSTSEC-2026-0369", reason = "zip::extract non appelé (burn-store lit seulement)" },
    # zstd 0.13 / zstd-safe 7, tirés par le même zip 8.6 (correctif en
    # zstd ≥ 0.14, que zip 8 n'accepte pas). Ils ne servent qu'aux entrées
    # compressées en zstd ; les `.pt`/`.ckpt` que lit burn-store sortent de
    # `torch.save`, qui les stocke sans compression, et leur empreinte est
    # vérifiée avant lecture. À retirer avec les trois précédents.
    { id = "RUSTSEC-2026-0391", reason = "zstd via zip 8 : archives PyTorch non compressées" },
    { id = "RUSTSEC-2026-0398", reason = "zstd via zip 8 : archives PyTorch non compressées" },
    { id = "RUSTSEC-2026-0403", reason = "zstd via zip 8 : archives PyTorch non compressées" },
]

[sources]
unknown-registry = "deny"
unknown-git = "allow" # bliss-rs et consorts peuvent venir de git
