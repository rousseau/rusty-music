name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Politique de dépendances : licences (GPL-3.0-or-later, aucune non libre),
  # avis de sécurité, crates directes sans mainteneur. Aucun build — rapide,
  # tourne sur un clone nu. Voir `deny.toml`.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Lint et tests. macOS : c'est la plateforme sur laquelle l'application est
  # vérifiée (bundle `.app`), et Tauri/CoreAudio y compilent sans dépendance
  # système à installer.
  lint-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `crates/analysis/build.rs` traduit l'encodeur CLAP depuis l'ONNX au
      # build ; `editor`/`superres` chargent leurs poids à l'exécution. Trop
      # lourds pour le dépôt (`.gitignore`), récupérés des release assets et
      # gardés en cache (clé = empreinte du script, qui porte les SHA-256).
      - name: Cache des modèles
        id: modeles
        uses: actions/cache@v4
        with:
          path: |
            models/clap-audio-encoder-b5.onnx
            models/htdemucs.safetensors
            models/aero-11025-44100.onnx
          key: modeles-${{ hashFiles('scripts/telecharger-modeles.sh') }}

      - name: Télécharger les modèles
        if: steps.modeles.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/telecharger-modeles.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
