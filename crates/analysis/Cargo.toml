[package]
name = "rusty-music-analysis"
description = "Empreintes audio et projection (module 2 — Exploration)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false        # composant de l'application, jamais publié seul sur crates.io

# Le backend se choisit à la compilation, comme le veut Burn. `gpu` passe par
# wgpu (Metal ici, Vulkan ou DX12 ailleurs) ; `cpu` est le repli pour une
# machine sans accélérateur. Compiler les deux doublerait la monomorphisation
# d'un modèle de 4 400 lignes générées.
[features]
default = ["gpu"]
gpu = ["burn/wgpu"]
cpu = ["burn/ndarray"]
# Compile sans les deux tours de CLAP (`models/*.onnx`) : encodeurs remplacés
# par des bouchons qui refusent de se charger. Pour la CI et un clone neuf —
# jamais pour une application qu'on distribue.
sans-modeles = []

[build-dependencies]
burn-onnx.workspace = true

[dev-dependencies]
anyhow.workspace = true
# Banc `extraits_aura` seulement (`docs/plan-balade.md`, P4) : la taille d'un
# extrait en Opus. Encodeur **pur Rust**, sans dépendance ni `build.rs`,
# BSD-3-Clause ; jamais lié au binaire tant que le cache d'extraits n'est pas
# retenu (`docs/journal.md`, P4).
opus-pure = "0.2"
rusty-music-player = { path = "../player" }

# `ndarray` toujours actif, en plus de `wgpu`/`ndarray` choisi par `gpu`/`cpu`
# ci-dessus : la tour texte de CLAP (`encodeur_texte.rs`) tourne toujours en
# CPU, même quand l'audio tourne en `wgpu` — voir sa documentation de module.
[dependencies]
burn                = { workspace = true, features = ["ndarray"] }
burn-store.workspace = true
rustfft.workspace   = true
rodio.workspace     = true
bhtsne.workspace    = true
serde.workspace     = true
pathfinding.workspace = true
petgraph.workspace  = true
rustworkx-core.workspace = true
rusty-music-core = { path = "../core" }
thiserror.workspace = true
tracing.workspace   = true
tokenizers.workspace = true
