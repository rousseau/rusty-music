[package]
name = "rusty-music-editor"
description = "Démixage en stems (module 3 — Éditeur / MAO)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false        # composant de l'application, jamais publié seul sur crates.io

# Le backend suit celui du module 2 : `wgpu` couvre Metal/Vulkan/DX12, `cpu`
# est le repli. `fusion` et `autotune` ne sont pas optionnels côté GPU pour ce
# modèle — mesuré 90 s sans eux contre 728 ms avec.
[features]
default = ["gpu"]
gpu = ["demucs-core/wgpu", "demucs-core/fusion", "demucs-core/autotune"]
cpu = ["demucs-core/ndarray"]
# Les types du coach qu'échangent les commandes Tauri, exportés en
# TypeScript par les seuls tests du bureau (`types_commandes.rs`).
specta = ["dep:specta"]

[dependencies]
# Fork porté en Burn 0.21 : l'amont est figé en 0.20.1 et n'a pas bougé depuis
# mars. Voir `docs/module3-demixage.md` pour la mesure qui a décidé cette voie.
# Licence Apache-2.0.
#
# Révision épinglée, jamais une branche : une branche se déplace, et le jour où
# elle bouge le build ne compilerait plus la même chose sans que rien ne le
# dise. Pour suivre le fork, on change ce `rev` sciemment.
demucs-core = { git = "https://github.com/rousseau/demucs-rs", rev = "effc95836cd848c17215a1b0af6e683aa6ee1421" }
burn.workspace       = true
# BS-RoFormer (`src/roformer/`) : le `.ckpt` PyTorch d'origine lu tel quel.
burn-store.workspace = true
rodio.workspace      = true
rustfft.workspace    = true
wsola.workspace      = true
# E6 : la transposition, hors ligne et juste (`etirement::transposer`),
# décidée après l'écoute à l'aveugle du banc E3. Signalsmith Stretch, MIT
# (enveloppe Rust de Colin Marc, C++ de Signalsmith Audio compilé par `cc`,
# liaisons par `bindgen`, d'où libclang à la construction). Même version que
# le banc.
signalsmith-stretch = "=0.1.3"
beat-this.workspace  = true
serde.workspace      = true
serde_json.workspace = true
rusty-music-core = { path = "../core" }
thiserror.workspace  = true
tracing.workspace    = true
specta = { version = "=2.0.0-rc.26", optional = true, features = ["derive"] }
