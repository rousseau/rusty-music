[package]
name = "rusty-music-enrichissement"
description = "Enrichissement en ligne : MusicBrainz, Discogs, Deezer, Last.fm, ListenBrainz, TheAudioDB, CritiqueBrainz."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false        # composant de l'application, jamais publié seul sur crates.io

[features]
# Les types qu'échangent les commandes Tauri, exportés en TypeScript par les
# seuls tests du bureau (`types_commandes.rs`).
specta = ["dep:specta"]

[dependencies]
specta = { version = "=2.0.0-rc.26", optional = true, features = ["derive"] }
rusty-music-core = { path = "../core" }
thiserror.workspace  = true
tracing.workspace    = true
serde.workspace      = true
serde_json.workspace = true
ureq.workspace       = true
flate2.workspace     = true
quick-xml.workspace  = true
