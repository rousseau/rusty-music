[package]
name = "rusty-music-player"
description = "Lecture audio (module 1) : sortie, transport, file d'attente."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false        # composant de l'application, jamais publié seul sur crates.io

[dependencies]
rusty-music-core = { path = "../core" }
# Déjà épinglé au niveau du workspace pour le module 2 : le spectrogramme
# des stems s'en sert aussi. Pas une nouvelle dépendance, un nouvel usage.
wsola.workspace      = true
rustfft.workspace   = true
rubato.workspace    = true
rodio.workspace   = true
cpal.workspace    = true
thiserror.workspace = true
serde.workspace   = true
tracing.workspace = true

# Latence de la sortie (`latence.rs`) : celle que cpal ne compte pas. Déjà
# dans le graphe par cpal, mêmes version et fonctions — un nouvel usage.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
