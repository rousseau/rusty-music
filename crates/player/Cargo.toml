[package]
name = "rusty-music-player"
description = "Lecture audio (module 1) : sortie, transport, file d'attente."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false        # composant de l'application, jamais publié seul sur crates.io

[dependencies]
rusty-music-core = { path = "../core" }
# Déjà épinglé au niveau du workspace pour le module 2 : le spectrogramme
# des stems s'en sert aussi. Pas une nouvelle dépendance, un nouvel usage.
wsola.workspace      = true
rustfft.workspace   = true
rubato.workspace    = true
rodio.workspace   = true
cpal.workspace    = true
thiserror.workspace = true
serde.workspace   = true
tracing.workspace = true
# V5 (suite de C4) : les types qu'échangent les commandes Tauri, exportés en
# TypeScript pour contrôler les réponses figées des tests d'interface.
# Activée par les seuls tests du bureau.
specta = { version = "=2.0.0-rc.26", optional = true, features = ["derive"] }
# E6 : la transposition en flux (`hauteur.rs`), décidée après l'écoute à
# l'aveugle du banc E3. Signalsmith Stretch, MIT (enveloppe Rust de Colin Marc,
# C++ de Signalsmith Audio compilé par `cc`, liaisons par `bindgen`, d'où
# libclang à la construction). Même version que le banc. Facultative : le
# compagnon iOS n'en a pas besoin, le bureau l'active.
signalsmith-stretch = { version = "=0.1.3", optional = true }

# Latence de la sortie (`latence.rs`) : celle que cpal ne compte pas. Déjà
# dans le graphe par cpal, mêmes version et fonctions — un nouvel usage.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }

[features]
specta = ["dep:specta"]
hauteur = ["dep:signalsmith-stretch"]

[[example]]
name = "salve_hauteur"
required-features = ["hauteur"]
