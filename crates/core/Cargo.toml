[package]
name = "rusty-music-core"
description = "Cœur d'ingestion : dossier surveillé, lecture des tags, base locale."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false        # composant de l'application, jamais publié seul sur crates.io

[dependencies]
anyhow.workspace    = true
thiserror.workspace = true
rusqlite.workspace  = true
rusqlite_migration.workspace = true
lofty.workspace     = true
notify.workspace    = true
walkdir.workspace   = true
tracing.workspace   = true
serde.workspace     = true
serde_json.workspace = true
ureq.workspace      = true
ogg.workspace       = true
opus-decoder.workspace = true
contour.workspace   = true
geo-types.workspace = true
# Décodage pleine piste natif pour la passe de loudness (crate::decode) —
# déjà utilisé par les trois autres crates, mêmes features qu'ailleurs.
rodio.workspace     = true
ebur128.workspace   = true
sha2.workspace      = true
image.workspace     = true
# Essai C4 (synthèse de novembre, O7) : les types que renvoient les commandes
# Tauri, exportés en TypeScript pour contrôler les réponses figées des tests
# d'interface. Activée par les seuls tests du bureau.
specta = { version = "=2.0.0-rc.26", optional = true, features = ["derive"] }

[features]
specta = ["dep:specta"]
