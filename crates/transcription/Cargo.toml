[package]
name = "rusty-music-transcription"
description = "Transcription automatique d'un stem (module 3 — pratiquer) : notes, cordes et frettes, quantification sur la pulsation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false        # composant de l'application, jamais publié seul sur crates.io

# Backend Burn de MuScriptor, comme `crates/analysis` : `wgpu` (Metal,
# Vulkan, DX12) ou le repli CPU.
[features]
default = ["gpu"]
gpu = ["burn/wgpu", "dep:burn-cubecl", "dep:burn-fusion", "dep:burn-ir", "dep:cubecl"]
cpu = ["burn/ndarray"]

[dependencies]
# MuScriptor (`src/muscriptor/`) : Transformer porté en Burn, poids chargés
# depuis le `model.safetensors` d'origine par `burn-store`.
burn.workspace = true
burn-store.workspace = true
# Noyau du produit mince (`src/muscriptor/mince.rs`) : CubeCL et l'opération
# personnalisée de la fusion, aux versions que tire déjà `burn` (MIT/Apache-2.0).
burn-cubecl = { version = "0.21", default-features = false, optional = true }
burn-fusion = { version = "0.21", default-features = false, optional = true }
burn-ir = { version = "0.21", default-features = false, optional = true }
cubecl = { version = "0.10", default-features = false, optional = true }
serde_json.workspace = true
# ONNX Runtime, comme `crates/superres` (même version épinglée) : Basic Pitch
# (Spotify, Apache-2.0) est livré en ONNX, CQT comprise dans le graphe.
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
ndarray = "0.16"
rubato.workspace = true
# FFT du spectrogramme de la batterie (même calcul que madmom).
rustfft.workspace = true
serde.workspace = true
rusty-music-core = { path = "../core" }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Décodage des exemples seulement : le crate, lui, ne décode rien.
rodio.workspace = true
