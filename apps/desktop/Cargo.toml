[package]
name = "rusty-music-desktop"
description = "Application de bureau : coquille « Atelier », module 1 (Lecteur)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false        # composant de l'application, jamais publié seul sur crates.io

[build-dependencies]
tauri-build.workspace = true
# Lire les ressources déclarées dans `tauri.conf.json` (`build.rs`).
serde_json.workspace = true

[dependencies]
rusty-music-core = { path = "../../crates/core" }
rusty-music-enrichissement = { path = "../../crates/enrichissement" }
rusty-music-lama = { path = "../../crates/lama" }
rusty-music-valise = { path = "../../crates/valise" }
rusty-music-player = { path = "../../crates/player" }
rusty-music-analysis = { path = "../../crates/analysis" }
rusty-music-carto = { path = "../../crates/carto" }
rusty-music-editor = { path = "../../crates/editor" }
rusty-music-superres = { path = "../../crates/superres" }
rusty-music-transcription = { path = "../../crates/transcription" }
# Lecture directe de `ville-paris.db` : `main.rs` appelle `osm::base::lire`
# pour brancher le plan de ville réel sur `carto::ville::rassembler`.
rusty-music-osm = { path = "../../crates/osm" }
tauri.workspace   = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
global-hotkey     = "0.8"
serde.workspace   = true
anyhow.workspace  = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde_json.workspace = true
# Le coach de Pratiquer (E4) : la batterie électronique en MIDI. MIT ;
# CoreMIDI sur macOS, ALSA sous Linux. `docs/recherche-coach-pratique.md`.
midir = "0.11"
# E5 : la basse en DI, écoutée sur l'entrée audio (`src/coach_basse.rs`).
# Déjà dans le graphe par rodio et rusty-music-player, même version
# (Apache-2.0) : un nouvel usage.
cpal.workspace = true

# Lecture des archives de tuiles, servies à la webview par un protocole
# personnalisé. `mmap-async-tokio` seul : le fichier est local, il n'y a ni S3
# ni HTTP à interroger. Tauri fait déjà tourner tokio, on ne l'ajoute pas.
pmtiles = { version = "0.24", default-features = false, features = ["mmap-async-tokio"] }
tokio = { version = "1", features = ["rt", "fs"] }

# Le serveur Wi-Fi du compagnon iOS (`src/wifi.rs`, étape 4B) : quelques
# requêtes JSON par jour, sur son propre fil. Synchrone et sans tokio, plutôt
# qu'un `axum`/`hyper` serveur pour si peu. Licence MIT OU Apache-2.0.
tiny_http = "0.12"

# « En cours de lecture » de macOS (centre de contrôle, AirPods, écran verrouillé)
# et commandes à distance — voir `src/systeme_media.rs`. macOS seulement : les
# autres plateformes gardent les raccourcis globaux (`global-hotkey`). Licence MIT.
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = { version = "0.8", default-features = false }
# V28 : compter les cœurs de performance (`sysctlbyname`) et donner aux fils
# de transposition la classe « initiée par l'utilisateur » (`pthread_set_qos_
# class_self_np`). Déjà dans le graphe (tokio, cpal…), mêmes version et
# licence (MIT ou Apache-2.0) : un nouvel usage.
libc = "0.2"

[features]
# Lama sans Ollama : le modèle de langue intégré (`explorer/modele_local.rs`).
# Compile llama.cpp (cmake requis) ; activée par `scripts/release.sh`.
lama-local = ["rusty-music-lama/lama-local"]

# Essai C4 (synthèse de novembre, O7) : `types_commandes.rs` exporte en
# TypeScript ce que renvoient quelques commandes, pour contrôler les réponses
# figées des tests d'interface (`ui-tests/fixtures.js`). Tests seulement : le
# binaire de l'application n'en dépend pas.
[dev-dependencies]
rusty-music-core = { path = "../../crates/core", features = ["specta"] }
rusty-music-carto = { path = "../../crates/carto", features = ["specta"] }
rusty-music-player = { path = "../../crates/player", features = ["specta"] }
rusty-music-editor = { path = "../../crates/editor", features = ["specta"] }
rusty-music-transcription = { path = "../../crates/transcription", features = ["specta"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "function", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
